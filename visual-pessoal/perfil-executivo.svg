<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310">

  <defs>
    <clipPath id="painel">
      <rect width="1200" height="310" rx="14"/>
    </clipPath>
  </defs>

  <!-- Fundo e barra lateral -->

  <g clip-path="url(#painel)">
    <rect width="1200" height="310" fill="#F3F5F5"/>
    <rect x="0" y="0" width="9" height="310" fill="#26D07C"/>
  </g>

  <!-- Identidade profissional -->

  <text x="45" y="48" fill="#087844" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="15" letter-spacing="4">
    IDENTIDADE PROFISSIONAL
  </text>

  <text x="45" y="105" fill="#0B1B24" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="43">
    Experiência que constrói.
  </text>

  <text x="45" y="155" fill="#0B1B24" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="43" font-style="normal">
    Conhecimento que transforma.
  </text>

  <line x1="45" y1="188" x2="1155" y2="188" stroke="#26D07C"/>

  <!-- Estratégia -->

  <text x="45" y="241" fill="#0B1B24" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="30">Estratégia</text>
  <text x="45" y="274" fill="#087844" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="20">Visão de negócios</text>

  <!-- Pessoas -->

  <text x="420" y="241" fill="#0B1B24" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="30">Pessoas</text>
  <text x="420" y="274" fill="#087844" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="20">Liderança e desenvolvimento</text>

  <!-- Tecnologia -->

  <text x="795" y="241" fill="#0B1B24" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="30">Tecnologia</text>
  <text x="795" y="274" fill="#087844" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="20">Inovação aplicada</text>


</svg>
