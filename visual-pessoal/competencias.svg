    <text x="112" y="62" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="29" font-weight="bold" fill="#FFFFFF">Liderança e pessoas</text>
    <text x="112" y="99" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="20" fill="#FFFFFF">Desenvolvimento de equipes</text>
