    <text x="112" y="62" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="29" font-weight="bold" fill="#FFFFFF">Inteligência artificial</text>
    <text x="112" y="99" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="20" fill="#FFFFFF">Tecnologia aplicada aos negócios</text>
  </g>

