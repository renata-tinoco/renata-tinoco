<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">

  <!-- Gestão estratégica -->
  <g transform="translate(5,5)">
    <rect width="580" height="145" rx="14" fill="#0B1B24"/>
    <path d="M0 28 L12 15 L23 21 L39 0 M27 0 H39 V12"
          transform="translate(30,46) scale(1.3)"
          stroke="#26D07C" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="62" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="29" font-weight="bold" fill="#FFFFFF">Gestão estratégica</text>
    <text x="112" y="99" font-family="Encode Sans, Roboto, Arial, sans-serif" font-size="20" fill="#FFFFFF">Planejamento e visão de negócios</text>
  </g>

  <!-- Liderança e pessoas -->
  <g transform="translate(615,5)">
