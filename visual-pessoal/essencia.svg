<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" font-family="Encode Sans, Roboto, Arial, sans-serif"><rect width="1200" height="475" rx="14" fill="#0B1B24"/><text x="50" y="65" font-size="29" fill="#FFFFFF" font-weight="normal" >Minha fé me direciona, o conhecimento me transforma e a curiosidade me</text><text x="50" y="105" font-size="29" fill="#FFFFFF" font-weight="normal" >mantém em movimento.</text><text x="50" y="170" font-size="29" fill="#FFFFFF" font-weight="normal" >Acredito na liderança que desenvolve pessoas, na estratégia que</text><text x="50" y="210" font-size="29" fill="#FFFFFF" font-weight="normal" >constrói possibilidades e na inovação que gera valor.</text><text x="50" y="275" font-size="29" fill="#FFFFFF" font-weight="normal" >Mais do que acompanhar transformações, busco participar da sua</text><text x="50" y="315" font-size="29" fill="#FFFFFF" font-weight="normal" >construção.</text><line x1="50" y1="380" x2="1150" y2="380" stroke="#26D07C" opacity=".6"/><text x="1150" y="440" font-size="35" fill="#26D07C" font-weight="bold" text-anchor="end">Renata Tinoco</text></svg>