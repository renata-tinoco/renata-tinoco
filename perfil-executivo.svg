<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">

  <defs>
    <clipPath id="painel">
      <rect width="1200" height="820" rx="14"/>
    </clipPath>
  </defs>

  <!-- Fundo e barra lateral -->

  <g clip-path="url(#painel)">
    <rect width="1200" height="820" fill="#F7F4EF"/>
    <rect x="0" y="0" width="9" height="820" fill="#C6AF87"/>
  </g>

  <!-- Identidade profissional -->

  <text x="45" y="48" fill="#597563" font-family="Arial" font-size="15" letter-spacing="4">
    IDENTIDADE PROFISSIONAL
  </text>

  <text x="45" y="105" fill="#192D28" font-family="Georgia, serif" font-size="43">
    Experiência que constrói.
  </text>

  <text x="45" y="155" fill="#192D28" font-family="Georgia, serif" font-size="43" font-style="italic">
    Conhecimento que transforma.
  </text>

  <line x1="45" y1="188" x2="1155" y2="188" stroke="#C6AF87"/>

  <!-- Estratégia -->

  <text x="45" y="228" fill="#927951" font-family="Arial" font-size="15">01</text>
  <text x="45" y="263" fill="#192D28" font-family="Georgia, serif" font-size="30">Estratégia</text>
  <text x="45" y="292" fill="#597563" font-family="Arial" font-size="20">Visão de negócios</text>

  <!-- Pessoas -->

  <text x="420" y="228" fill="#927951" font-family="Arial" font-size="15">02</text>
  <text x="420" y="263" fill="#192D28" font-family="Georgia, serif" font-size="30">Pessoas</text>
  <text x="420" y="292" fill="#597563" font-family="Arial" font-size="20">Liderança e desenvolvimento</text>

  <!-- Tecnologia -->

  <text x="795" y="228" fill="#927951" font-family="Arial" font-size="15">03</text>
  <text x="795" y="263" fill="#192D28" font-family="Georgia, serif" font-size="30">Tecnologia</text>
  <text x="795" y="292" fill="#597563" font-family="Arial" font-size="20">Inovação aplicada</text>

  <line x1="45" y1="320" x2="1155" y2="320" stroke="#C6AF87"/>

  <!-- Perfil executivo com alinhamento justificado -->

  <g fill="#192D28" font-family="Arial, sans-serif" font-size="24">

    <text x="45" y="370" textLength="1110" lengthAdjust="spacing">
      Com mais de <tspan font-weight="bold">30 anos de experiência profissional</tspan>, minha trajetória integra gestão
    </text>

    <text x="45" y="404">
      estratégica, liderança, conhecimento técnico e inovação.
    </text>

    <text x="45" y="454" textLength="1110" lengthAdjust="spacing">
      Atuo na gestão de operações complexas, no desenvolvimento de equipes, na estruturação
    </text>

    <text x="45" y="488">
      de projetos e na transformação de processos empresariais.
    </text>

    <text x="45" y="538" textLength="1110" lengthAdjust="spacing">
      Minha experiência contempla gestão de negócios, rentabilidade, capacidade operacional,
    </text>

    <text x="45" y="572">
      indicadores de desempenho, conformidade e desenvolvimento de soluções tecnológicas.
    </text>

    <text x="45" y="622" textLength="1110" lengthAdjust="spacing">
      Tenho como característica a inquietude diante de processos que podem ser melhorados.
    </text>

    <text x="45" y="656" textLength="1110" lengthAdjust="spacing">
      Gosto de investigar, questionar, conectar conhecimentos e transformar necessidades
    </text>

    <text x="45" y="690">
      empresariais em soluções práticas.
    </text>

  </g>

  <line x1="45" y1="720" x2="1155" y2="720" stroke="#C6AF87"/>

  <!-- Visão profissional -->

  <g fill="#806A46" font-family="Georgia, serif" font-size="25" font-style="italic">


  </g>

</svg>
