name: Atualizar identidade visual pessoal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-perfil:
    runs-on: ubuntu-latest

    steps:
      - name: Acessar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Criar identidade visual completa
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html import escape
          import re
          import textwrap
          import xml.etree.ElementTree as ET

          # ==========================================
          # IDENTIDADE VISUAL — RENATA TINOCO
          # ==========================================

          MARINHO = "#0B1B24"
          VERDE = "#26D07C"
          CINZA = "#D9D9D6"
          BRANCO = "#FFFFFF"
          CLARO = "#F3F5F5"
          VERDE_ESCURO = "#087844"
          BORDA = "#D1DDD7"
          FONTE = "Encode Sans, Roboto, Arial, sans-serif"

          pasta = Path("visual-pessoal")
          readme = Path("README.md")
          conteudo = readme.read_text(encoding="utf-8")

          if "./visual-pessoal/banner.svg" in conteudo:
              print("Identidade visual ja aplicada.")
              raise SystemExit(0)

          pasta.mkdir(exist_ok=True)

          def salvar(nome, codigo):
              ET.fromstring(codigo)
              (pasta / nome).write_text(codigo, encoding="utf-8")

          def svg(altura, elementos):
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="1200" height="{altura}" '
                  f'viewBox="0 0 1200 {altura}" '
                  f'font-family="{FONTE}">'
                  + "".join(elementos)
                  + "</svg>"
              )

          def texto(x, y, valor, tamanho=24, cor=MARINHO,
                    peso="normal", extra=""):
              return (
                  f'<text x="{x}" y="{y}" '
                  f'font-size="{tamanho}" fill="{cor}" '
                  f'font-weight="{peso}" {extra}>'
                  f'{escape(valor)}</text>'
              )

          def painel(altura):
              return [
                  f'<rect width="1200" height="{altura}" '
                  f'rx="14" fill="{CLARO}"/>',
                  f'<rect x="0" y="12" width="8" '
                  f'height="{altura-24}" rx="4" fill="{VERDE}"/>'
              ]

          def paragrafo(valor, x, y, largura=86,
                        tamanho=24, cor=MARINHO):
              elementos = []
              linhas = textwrap.wrap(
                  valor, width=largura,
                  break_long_words=False,
                  break_on_hyphens=False
              )
              for i, linha in enumerate(linhas):
                  ajuste = ""
                  if i < len(linhas)-1:
                      ajuste = 'textLength="1100" lengthAdjust="spacing"'
                  elementos.append(
                      texto(x, y, linha, tamanho, cor, extra=ajuste)
                  )
                  y += 34
              return elementos, y + 15

          # ==========================================
          # 01 — BANNER PRINCIPAL
          # ==========================================

          e = [
              '<defs><linearGradient id="fundo" x1="0%" y1="0%" '
              'x2="100%" y2="100%">'
              '<stop offset="0%" stop-color="#0B1B24"/>'
              '<stop offset="100%" stop-color="#15392F"/>'
              '</linearGradient></defs>',
              '<rect width="1200" height="420" rx="12" '
              'fill="url(#fundo)"/>'
          ]

          for i in range(10):
              x = 800 + i*36
              y = 65 + i*13
              e.append(
                  f'<path d="M{x} 0 V{y} L{x+70} {y+70} V420" '
                  f'fill="none" stroke="{VERDE}" opacity=".17"/>'
              )

          pontos = [
              (880,80),(1060,45),(990,205),
              (1150,280),(850,350),(1050,385)
          ]

          for x,y in pontos:
              e.extend([
                  f'<line x1="990" y1="205" x2="{x}" y2="{y}" '
                  f'stroke="{VERDE}" opacity=".4"/>',
                  f'<circle cx="{x}" cy="{y}" r="5" fill="{VERDE}"/>',
                  f'<circle cx="{x}" cy="{y}" r="17" fill="none" '
                  f'stroke="{VERDE}" opacity=".25"/>'
              ])

          e.extend([
              f'<rect x="48" y="48" width="45" height="5" '
              f'rx="2" fill="{VERDE}"/>',
              texto(48,87,"CONHECIMENTO · ESTRATÉGIA · INOVAÇÃO",
                    17,VERDE,extra='letter-spacing="4"'),
              texto(45,182,"Renata Tinoco",80,BRANCO,"bold"),
              texto(48,232,
                    "Gestão estratégica e tecnologia aplicada aos negócios.",
                    28,CINZA),
              f'<rect x="48" y="275" width="570" height="52" '
              f'rx="6" fill="{VERDE}" opacity=".1"/>',
              texto(65,309,"A vida se organiza no movimento.",26,VERDE),
              texto(48,383,"PESSOAS / TECNOLOGIA / RESULTADOS",
                    15,CINZA,extra='letter-spacing="4"')
          ])

          salvar("banner.svg",svg(420,e))

          # ==========================================
          # 02 — EXPERIENCIA E FORMACAO
          # ==========================================

          dados = [
              ("30+","ANOS DE EXPERIÊNCIA","Gestão e operações"),
              ("2 MBAs","FORMAÇÃO EXECUTIVA","Projetos e estratégia"),
              ("Psicologia","DESENVOLVIMENTO CONTÍNUO",
               "Graduação em andamento")
          ]

          e = []

          for i,(valor,titulo,descricao) in enumerate(dados):
              x = i*400+5
              e.extend([
                  f'<rect x="{x}" y="5" width="390" '
                  f'height="210" rx="12" fill="{MARINHO}"/>',
                  f'<rect x="{x+25}" y="25" width="40" '
                  f'height="5" rx="2" fill="{VERDE}"/>',
                  texto(x+25,98,valor,48,VERDE,"bold"),
                  texto(x+25,147,titulo,17,BRANCO,"bold"),
                  texto(x+25,181,descricao,20,CINZA)
              ])

          salvar("experiencia.svg",svg(220,e))

          # ==========================================
          # 03 — MODERNIZAR ARQUIVOS EXISTENTES
          # ==========================================

          def modernizar(origem, destino, claro=False):
              codigo = Path(origem).read_text(encoding="utf-8")

              cores = {
                  "#192D28": MARINHO,
                  "#C6AF87": VERDE,
                  "#F7F4EF": CLARO if claro else BRANCO,
                  "#B7C6BB": CINZA,
                  "#597563": VERDE_ESCURO,
                  "#927951": VERDE_ESCURO,
                  "#806A46": VERDE_ESCURO,
                  "#849488": VERDE_ESCURO
              }

              for antiga,nova in cores.items():
                  codigo = codigo.replace(antiga,nova)

              codigo = codigo.replace(
                  "Georgia, serif", FONTE
              ).replace(
                  'font-style="italic"', 'font-style="normal"'
              ).replace(
                  'font-family="Arial"', f'font-family="{FONTE}"'
              ).replace(
                  'font-family="Arial, sans-serif"',
                  f'font-family="{FONTE}"'
              )

              if destino == "competencias.svg":
                  codigo = codigo.replace(
                      'font-size="29" fill="#26D07C"',
                      'font-size="29" font-weight="bold" fill="#FFFFFF"'
                  )

              if destino == "perfil-executivo.svg":
                  frase = (
                      f'<line x1="45" y1="720" x2="1155" y2="720" '
                      f'stroke="{VERDE}"/>'
                      + texto(
                          45,762,
                          "Acredito que a tecnologia, quando associada à "
                          "experiência e à visão estratégica,",
                          25,VERDE_ESCURO
                      )
                      + texto(
                          45,794,
                          "amplia nossa capacidade de decidir, criar e transformar.",
                          25,VERDE_ESCURO
                      )
                  )

                  if "Acredito que a tecnologia" not in codigo:
                      codigo = codigo.replace("</svg>",frase+"</svg>")

              if destino == "formacao.svg":
                  codigo = codigo.replace(
                      f'fill="{MARINHO}"',f'fill="{CLARO}"'
                  ).replace(
                      f'fill="{BRANCO}"',f'fill="{MARINHO}"'
                  ).replace(
                      f'fill="{CINZA}"',f'fill="{MARINHO}"'
                  )

                  codigo = re.sub(
                      r'(<text\b[^>]*?)fill="#26D07C"',
                      r'\1fill="#087844"', codigo
                  )

              salvar(destino,codigo)

          modernizar(
              "perfil-executivo-v3.svg",
              "perfil-executivo.svg",
              claro=True
          )
          modernizar("competencias.svg","competencias.svg")
          modernizar("formacao.svg","formacao.svg")
          modernizar("visao-executiva.svg","visao-executiva.svg")

          # ==========================================
          # 04 — TODOS OS TITULOS
          # ==========================================

          titulos = [
              ("perfil","Perfil executivo"),
              ("competencias","Competências estratégicas"),
              ("atuacao","Minha atuação"),
              ("formacao","Formação acadêmica"),
              ("tecnologia","Tecnologia aplicada aos negócios"),
              ("metodologia","Minha metodologia de inovação"),
              ("portfolio","Portfólio de inovação"),
              ("conhecimento","Conhecimento em constante evolução"),
              ("essencia","Minha essência"),
              ("contato","Conecte-se comigo")
          ]

          for i,(arquivo,titulo) in enumerate(titulos,1):
              e = [
                  f'<rect width="1200" height="86" '
                  f'rx="9" fill="{MARINHO}"/>',
                  f'<rect x="20" y="21" width="6" height="44" '
                  f'rx="3" fill="{VERDE}"/>',
                  texto(45,56,titulo,36,BRANCO,"bold"),
                  texto(1150,54,f"{i:02}",23,VERDE,"bold",
                        'text-anchor="end"')
              ]

              salvar(f"titulo-{arquivo}.svg",svg(86,e))

          # ==========================================
          # 05 — CAPTURAR CONTEUDO DO README
          # ==========================================

          def secao(chave):
              padrao = (
                  r'(!\[[^\n]+\]\(\./titulo-'
                  + re.escape(chave)
                  + r'\.svg\)\n\n)(.*?)(?=\n---\n|\Z)'
              )
              resultado = re.search(padrao,conteudo,re.S)

              if not resultado:
                  raise ValueError(
                      f"Secao nao localizada: {chave}"
                  )

              return resultado

          def inserir_painel(chave,arquivo,descricao):
              global conteudo

              resultado = secao(chave)
              original = resultado.group(2).strip()

              novo = (
                  resultado.group(1)
                  + f"![{descricao}](./visual-pessoal/{arquivo})\n\n"
                  + "<details>\n"
                  + "<summary>Consultar conteúdo em texto</summary>\n\n"
                  + original
                  + "\n\n</details>\n"
              )

              conteudo = (
                  conteudo[:resultado.start()]
                  + novo
                  + conteudo[resultado.end():]
              )

          # ==========================================
          # 06 — MINHA ATUACAO
          # ==========================================

          original = secao("atuacao").group(2)

          blocos = re.findall(
              r'^###\s+(.+)\n\n(.*?)(?=\n###\s|\Z)',
              original,re.M|re.S
          )

          if not blocos:
              raise ValueError("Conteudo de atuacao nao localizado.")

          e = []
          y = 55

          for i,(titulo,descricao) in enumerate(blocos,1):
              descricao = " ".join(descricao.split())

              e.extend([
                  texto(48,y,f"{i:02}",24,VERDE_ESCURO,"bold"),
                  texto(120,y,titulo,31,MARINHO,"bold")
              ])

              linhas,y = paragrafo(descricao,48,y+46)
              e.extend(linhas)

              e.append(
                  f'<line x1="48" y1="{y}" x2="1152" y2="{y}" '
                  f'stroke="{BORDA}"/>'
              )

              y += 55

          salvar("atuacao.svg",svg(y,painel(y)+e))

          inserir_painel(
              "atuacao","atuacao.svg",
              "Áreas de atuação profissional"
          )

          # ==========================================
          # 07 — TECNOLOGIAS E FERRAMENTAS
          # ==========================================

          ferramentas = [
              "Python","Claude","ChatGPT","Cursor",
              "GitHub","Power BI","Power Automate","Streamlit"
          ]

          e = [
              f'<rect width="1200" height="290" '
              f'rx="14" fill="{MARINHO}"/>'
          ]

          for i,nome in enumerate(ferramentas):
              x = 25+(i%4)*292
              y = 22+(i//4)*125

              e.extend([
                  f'<rect x="{x}" y="{y}" width="270" height="110" '
                  f'rx="10" fill="#15302F" stroke="{VERDE}" '
                  f'stroke-opacity=".35"/>',
                  f'<circle cx="{x+23}" cy="{y+23}" '
                  f'r="5" fill="{VERDE}"/>',
                  texto(x+135,y+67,nome,27,BRANCO,"bold",
                        'text-anchor="middle"')
              ])

          salvar("tecnologias.svg",svg(290,e))

          inserir_painel(
              "tecnologia","tecnologias.svg",
              "Python, Claude, ChatGPT, Cursor, GitHub, "
              "Power BI, Power Automate e Streamlit"
          )

          # ==========================================
          # 08 — METODOLOGIA DE INOVACAO
          # ==========================================

          etapas = [
              "Observar","Questionar","Estruturar",
              "Construir","Validar","Evoluir"
          ]

          e = [
              f'<rect width="1200" height="190" '
              f'rx="14" fill="{MARINHO}"/>',
              f'<line x1="100" y1="70" x2="1100" y2="70" '
              f'stroke="{VERDE}" stroke-width="2"/>'
          ]

          for i,nome in enumerate(etapas):
              x = 100+i*200

              e.extend([
                  f'<circle cx="{x}" cy="70" r="34" '
                  f'fill="{MARINHO}" stroke="{VERDE}" '
                  f'stroke-width="3"/>',
                  texto(x,80,str(i+1),29,VERDE,"bold",
                        'text-anchor="middle"'),
                  texto(x,140,nome,23,BRANCO,"bold",
                        'text-anchor="middle"')
              ])

          salvar("metodologia.svg",svg(190,e))

          inserir_painel(
              "metodologia","metodologia.svg",
              "Observar, questionar, estruturar, "
              "construir, validar e evoluir"
          )

          # ==========================================
          # 09 — PORTFOLIO DE INOVACAO
          # ==========================================

          original = secao("portfolio").group(2)

          projetos = []

          for linha in original.splitlines():
              if linha.startswith("|"):
                  colunas = [
                      item.strip()
                      for item in linha.strip("|").split("|")
                  ]

                  if len(colunas)==2:
                      if colunas[0]!="Linha de desenvolvimento":
                          if not colunas[0].startswith(":"):
                              projetos.append(tuple(colunas))

          if not projetos:
              raise ValueError("Portfolio nao localizado.")

          e = []
          altura = ((len(projetos)+1)//2)*175

          for i,(titulo,descricao) in enumerate(projetos):
              x = 5+(i%2)*600
              y = 5+(i//2)*175

              e.extend([
                  f'<rect x="{x}" y="{y}" width="590" '
                  f'height="160" rx="12" fill="{MARINHO}"/>',
                  f'<rect x="{x+25}" y="{y+24}" '
                  f'width="36" height="4" rx="2" fill="{VERDE}"/>',
                  texto(x+25,y+68,titulo,29,BRANCO,"bold")
              ])

              for j,linha in enumerate(
                  textwrap.wrap(descricao,width=46)
              ):
                  e.append(
                      texto(x+25,y+108+j*28,linha,22,CINZA)
                  )

          salvar("portfolio.svg",svg(altura,e))

          inserir_painel(
              "portfolio","portfolio.svg",
              "Linhas de desenvolvimento e inovação"
          )

          # ==========================================
          # 10 — CONHECIMENTO EM EVOLUCAO
          # ==========================================

          original = secao("conhecimento").group(2)

          assuntos = re.findall(
              r'^-\s+(.+)$',original,re.M
          )

          altura = 40+len(assuntos)*65
          e = painel(altura)

          for i,assunto in enumerate(assuntos):
              y = 55+i*65

              e.extend([
                  f'<circle cx="55" cy="{y-9}" '
                  f'r="7" fill="{VERDE_ESCURO}"/>',
                  texto(85,y,assunto,27,MARINHO,"bold")
              ])

          salvar("conhecimento.svg",svg(altura,e))

          inserir_painel(
              "conhecimento","conhecimento.svg",
              "Áreas de conhecimento em constante evolução"
          )

          # ==========================================
          # 11 — MINHA ESSENCIA
          # ==========================================

          original = secao("essencia").group(2).strip()
          paragrafos = original.split("\n\n")

          e = []
          y = 65

          for par in paragrafos:
              par = " ".join(par.split())

              for linha in textwrap.wrap(par,width=70):
                  e.append(texto(50,y,linha,29,BRANCO))
                  y += 40

              y += 25

          e.extend([
              f'<line x1="50" y1="{y}" x2="1150" y2="{y}" '
              f'stroke="{VERDE}" opacity=".6"/>',
              texto(1150,y+60,"Renata Tinoco",35,VERDE,"bold",
                    'text-anchor="end"')
          ])

          altura = y+95

          salvar(
              "essencia.svg",
              svg(
                  altura,
                  [f'<rect width="1200" height="{altura}" '
                   f'rx="14" fill="{MARINHO}"/>']+e
              )
          )

          inserir_painel(
              "essencia","essencia.svg",
              "Minha essência profissional e pessoal"
          )

          # ==========================================
          # 12 — ATUALIZAR REFERENCIAS
          # ==========================================

          referencias = {
              "banner.svg":"banner.svg",
              "experiencia-v2.svg":"experiencia.svg",
              "perfil-executivo-v3.svg":"perfil-executivo.svg",
              "competencias.svg":"competencias.svg",
              "formacao.svg":"formacao.svg",
              "visao-executiva.svg":"visao-executiva.svg"
          }

          for arquivo,titulo in titulos:
              nome = f"titulo-{arquivo}.svg"
              referencias[nome] = nome

          for antigo,novo in referencias.items():
              conteudo = conteudo.replace(
                  f"(./{antigo})",
                  f"(./visual-pessoal/{novo})"
              )

          # Frase ja incorporada ao perfil executivo.

          conteudo = re.sub(
              r'^!\[.*?\]\(\./visual-pessoal/visao-executiva\.svg\)\n*',
              '',
              conteudo,
              flags=re.M
          )

          # Atualizar as cores das etiquetas existentes.

          conteudo = conteudo.replace(
              "-192D28?","-0B1B24?"
          )

          # Retirar separadores repetidos.

          conteudo = re.sub(
              r'\n---\n\s*\n---\n',
              '\n---\n',
              conteudo
          )

          # Verificar se as novas imagens existem.

          for caminho in re.findall(
              r'\]\(\./(visual-pessoal/[^)]+)\)',
              conteudo
          ):
              if not Path(caminho).is_file():
                  raise FileNotFoundError(caminho)

          # Salvar a apresentacao atualizada.

          readme.write_text(conteudo,encoding="utf-8")

          print("Identidade visual criada com sucesso.")
          print("Arquivos originais preservados.")

          PY

      - name: Publicar identidade visual
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md visual-pessoal/

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
          else
            git commit -m "Atualiza identidade visual do portfolio profissional"
            git push origin HEAD:main
          fi
